<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sainte-Barbe 2026 — Compte à rebours</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#f8edcf;background:#062b22}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#145b43 0%,#062b22 58%,#021a16 100%)}body:before{content:'';position:fixed;inset:18px;border:1px solid #cda65c88;pointer-events:none}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,#e2b86b22,transparent 27%,transparent 75%,#d6a85b18)}.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4vh 4vw;gap:1.3vh}.brand{font:600 clamp(16px,2.2vw,33px) Arial,sans-serif;letter-spacing:.42em;color:#f6e7c5}.brand small{display:block;font:500 clamp(10px,1vw,16px) Arial,sans-serif;letter-spacing:.1em;color:#dfc88d;margin-top:5px}.eyebrow{font:500 clamp(11px,1.2vw,18px) Arial,sans-serif;letter-spacing:.3em;color:#e3d2aa}.title{font-size:clamp(45px,7vw,112px);line-height:1.02;margin:0;background:linear-gradient(#fff3cb,#e3b456 52%,#fff0c2);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 8px 35px #0004}.year{font-size:clamp(26px,3.3vw,54px);letter-spacing:.42em;margin:0;color:#e9d5a0}.theme{font:600 clamp(12px,1.3vw,21px) Arial,sans-serif;letter-spacing:.3em;color:#f1d79b}.theme strong{font:700 clamp(24px,3vw,50px) Georgia,serif;letter-spacing:.1em;display:block;color:#fff1ca;margin-top:6px}.lead{font:500 clamp(14px,1.5vw,23px) Arial,sans-serif;letter-spacing:.16em;color:#e5d3a9;margin:1.5vh 0}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,30px);width:min(1100px,95vw)}.unit{background:linear-gradient(150deg,#f8e9c9 0%,#f0d9a5 50%,#d6ad64 100%);border:3px solid #d5a34b;border-radius:18px;padding:clamp(14px,2vw,28px) 4px;box-shadow:0 0 0 2px #fff4c333,0 16px 35px #0007,inset 0 2px 12px #fff8}.number{font:700 clamp(40px,7vw,110px) Georgia,serif;line-height:1.2;color:#064431;font-variant-numeric:tabular-nums;transition:transform .15s ease}.unit.tick .number{transform:translateY(-3px)}.unit label{display:block;font:700 clamp(11px,1.3vw,18px) Arial,sans-serif;letter-spacing:.18em;color:#164b3b;margin-top:8px}.footer{font:500 clamp(12px,1.5vw,22px) Arial,sans-serif;letter-spacing:.09em;line-height:1.6;color:#fff2d0;margin-top:2vh}.footer b{color:#e9c17b}.notice{font:400 12px Arial,sans-serif;color:#d7c9a7aa;position:fixed;bottom:10px;right:22px} @media(max-width:650px){.timer{grid-template-columns:repeat(2,minmax(0,1fr));max-width:500px}.wrap{gap:1.4vh}.title{font-size:12vw}.unit{padding:12px 4px}.number{font-size:15vw}.notice{display:none}}@media(max-height:650px) and (min-width:700px){.wrap{gap:.6vh}.title{font-size:6vw}.unit{padding:10px}.number{font-size:6vw}.footer{margin-top:0}}
</style></head><body><main class="wrap"><div class="brand">PERENCO<small>Oil &amp; Gas Gabon</small></div><div class="eyebrow">LA DIRECTION GÉNÉRALE VOUS CONVIE À SA SOIRÉE DE GALA</div><h1 class="title">SAINTE-BARBE</h1><div class="year">2026</div><div class="theme">THÈME <strong>PIONNIER</strong></div><div class="lead">LE GRAND RENDEZ-VOUS APPROCHE…</div><section class="timer" aria-label="Compte à rebours jusqu'à la soirée"><div class="unit"><div id="days" class="number">--</div><label>JOURS</label></div><div class="unit"><div id="hours" class="number">--</div><label>HEURES</label></div><div class="unit"><div id="minutes" class="number">--</div><label>MINUTES</label></div><div class="unit"><div id="seconds" class="number">--</div><label>SECONDES</label></div></section><div class="footer"><b>SAMEDI 5 DÉCEMBRE 2026 · 18H30</b><br>COMPLEXE SPORTIF NINA FLORE ZOGO</div></main><div class="notice">Heure de référence : Gabon (UTC+1)</div><script>
const target=Date.parse('2026-12-05T18:30:00+01:00');let prev='';function update(){let ms=Math.max(0,target-Date.now()),s=Math.floor(ms/1000);const vals=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];['days','hours','minutes','seconds'].forEach((id,i)=>{const el=document.getElementById(id),v=String(vals[i]).padStart(2,'0');if(el.textContent!==v){el.textContent=v;if(i===3){el.parentElement.classList.remove('tick');void el.offsetWidth;el.parentElement.classList.add('tick');}}});if(ms===0)document.querySelector('.lead').textContent='LA SOIRÉE DE GALA COMMENCE !'}update();setInterval(update,200);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});
</script></body></html>
